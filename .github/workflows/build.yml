name: Build STM32 Wear-Leveling

on:
  push:
    branches: [ main, master, fix/*, port/* ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:    # ← permet de lancer manuellement depuis GitHub

jobs:
  build-f401:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '10.3-2021.10'
      - name: Build F401
        run: |
          make clean
          make MCU=STM32F401

  build-f767:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '10.3-2021.10'
      - name: Syntax check F767 core
        run: |
          # flash_manager.c is HAL-independent — verify it compiles for F767
          arm-none-eabi-gcc -O2 -Wall -g -std=c11 \
            -mcpu=cortex-m7 -mthumb -mfpu=fpv5-d16 -mfloat-abi=hard \
            -DSTM32F767 -DSTM32F767xx \
            -c src/flash_manager.c -o /dev/null
          echo "F767 core syntax OK"
          echo "Note: wl_hal_stm32f7.c requires stm32f7xx_hal.h from STM32CubeF7"


  build-u385:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '10.3-2021.10'
      - name: Syntax check U385 core
        run: |
          arm-none-eabi-gcc -O2 -Wall -g -std=c11 \
            -mcpu=cortex-m33 -mthumb -mfpu=fpv5-sp-d16 -mfloat-abi=hard \
            -DSTM32U385 -DSTM32U385xx \
            -c src/flash_manager.c -o /dev/null
          echo "U385 core syntax OK"
      - name: Syntax check U385 HAL
        run: |
          arm-none-eabi-gcc -O2 -Wall -g -std=c11 \
            -mcpu=cortex-m33 -mthumb -mfpu=fpv5-sp-d16 -mfloat-abi=hard \
            -DSTM32U385 -DSTM32U385xx \
            -I. \
            -c src/wl_hal_stm32u3.c -o /dev/null
          echo "U385 HAL syntax OK"